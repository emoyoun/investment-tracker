name: Update data.json from FRED

# Scheduled researcher: every morning it pulls the latest FRED readings and, if
# anything changed, commits data.json back to the default branch. A push to
# master then triggers the Pages deploy workflow, so the live dashboard follows.
#
# Requires a repository secret FRED_API_KEY (Settings -> Secrets and variables
# -> Actions). Get a free key at https://fredaccount.stlouisfed.org/apikeys

on:
  schedule:
    # 12:00 UTC daily ~ 07:00/08:00 US Eastern — after the prior session's H.15 release.
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and log changes without committing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh data.json from FRED
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/update-from-fred.mjs --dry-run
          else
            node scripts/update-from-fred.mjs
          fi

      - name: Validate data.json
        run: python3 -c "import json;json.load(open('data.json'));print('data.json is valid JSON')"

      - name: Commit and push if changed
        if: ${{ inputs.dry_run != true }}
        run: |
          if git diff --quiet -- data.json; then
            echo "No changes to data.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "chore(data): refresh FRED readings ($(date -u +%Y-%m-%d))"
          git push
